name: CI

# The application is developed on macOS and has never been executed on Linux or
# Windows. Everything except reading a .wiff is platform-neutral Python, so the
# whole suite runs on all three here — which is what stops the two untried
# platforms from drifting further out of reach.

# In a private repository a macOS minute is billed as ten and a Windows minute
# as two, and this workflow was using 98% of the free allowance — nearly two
# thirds of it macOS. What follows spends the expensive runners where a mistake
# would actually escape, and Linux everywhere else.

on:
  push:
    branches: [main]
    # tagging is the release action: it is what builds the three installers.
    # Without this the package job below could never fire, because its own
    # condition asks for a ref the workflow was never started for.
    tags: ["v*"]
    # a change to prose cannot break a build
    paths-ignore: ["**.md", "docs/**", "LICENSE"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", "LICENSE"]
  workflow_dispatch:
  # the vendor libraries are checked once a week rather than on every commit;
  # see the job itself
  schedule:
    - cron: "17 6 * * 1"

# pushing a branch and then a tag started two full runs, and a quick second
# push started a third while the first was still going. Only the newest run
# for a given ref is worth finishing.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # Linux runs on everything; macOS and Windows on a pull request, on a
      # tag, and on request — the places where a mistake would otherwise reach
      # a release. A plain push to main is then 6 billable minutes instead of
      # 33.
      #
      # The matrix is what varies rather than a condition on the job, because
      # a job's own `if` cannot see the matrix context. Both lists name
      # ubuntu 3.10 as well: it is the floor pyproject declares, and it stays
      # true only by being run.
      matrix:
        include: >-
          ${{ fromJSON(
            (github.event_name == 'pull_request'
             || github.event_name == 'workflow_dispatch'
             || startsWith(github.ref, 'refs/tags/'))
            && '[{"os":"ubuntu-latest","python":"3.13"},
                 {"os":"ubuntu-latest","python":"3.10"},
                 {"os":"macos-latest","python":"3.13"},
                 {"os":"windows-latest","python":"3.13"}]'
            || '[{"os":"ubuntu-latest","python":"3.13"},
                 {"os":"ubuntu-latest","python":"3.10"}]'
          ) }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      # PyQt6 needs these even under the offscreen platform: they are linked at
      # import, not at window creation, so without them the import itself fails
      - name: Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libdbus-1-3 libglib2.0-0 xvfb

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest

      # Linux gets a real X server rather than Qt's offscreen platform.
      # offscreen crashed inside pg.PlotWidget's own constructor — a segfault
      # with no Python frame under it, in different tests from run to run —
      # and the same construction is fine under xvfb and on the other two
      # systems. macOS and Windows stay offscreen, where they are steady.
      # a name used without being imported is a crash that only happens on the
      # line that uses it — one was sitting in the statistics table, on the
      # path taken when an injection is excluded. Linux only: it is the same
      # answer on every system and costs one billable minute.
      - name: Undefined names and dead code
        if: runner.os == 'Linux' && matrix.python == '3.13'
        run: |
          python -m pip install ruff
          ruff check milq tests --select F,E9,B019

      - name: Test
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a python -m pytest -q
          else
            QT_QPA_PLATFORM=offscreen python -m pytest -q
          fi

      # its own process, and its own step per system: Windows is steady
      # under offscreen and Linux is not, and forcing one shell on both was
      # itself enough to change the answer once.
      - name: The app starts
        if: runner.os != 'Linux'
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -X faulthandler tests/smoke_start.py

      - name: The app starts
        if: runner.os == 'Linux'
        run: xvfb-run -a python -X faulthandler tests/smoke_start.py

  wiff:
    # Reading a .wiff is the one platform-specific path: it loads SCIEX's
    # managed assemblies through a .NET runtime, by a different route on
    # Windows than on macOS and Linux. This reports whether the runtime and the
    # assemblies come up at all, which is as far as CI can go without a raw
    # file — those are not in the repository.
    name: .NET bootstrap · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # Once a week, on a tag, or on request. This checks that SCIEX's managed
    # assemblies still load under a .NET runtime on three systems — which
    # depends on those assemblies and that runtime, not on anything committed
    # here, and changes perhaps once a year. Running it on every push was 642
    # billable minutes, a third of the whole allowance, to re-learn the same
    # answer.
    if: >-
      github.event_name == 'schedule'
      || github.event_name == 'workflow_dispatch'
      || startsWith(github.ref, 'refs/tags/')
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Load the SCIEX libraries
        run: |
          python -c "
          import platform
          from milq import bootstrap
          print('system:', platform.system())
          print('dotnet root:', bootstrap.find_dotnet_root())
          bootstrap.ensure()
          print('Clearcore2 loaded')
          "

  package:
    # One artefact per system, each built on its own runner: there is no cross
    # compilation for this, and a bundle is the interpreter plus every compiled
    # extension for that machine.
    #
    # Nothing is signed. On macOS that costs nothing until the file travels —
    # Gatekeeper reacts to the quarantine attribute a download attaches, not to
    # the absence of a signature. On Windows SmartScreen will warn until there
    # is a certificate.
    name: Package · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: test
    if: >-
      github.event_name == 'workflow_dispatch'
      || startsWith(github.ref, 'refs/tags/')
    # needed to create the release and hang the installers off it
    permissions:
      contents: write
    strategy:
      fail-fast: false
      # `macos-15-intel` is the Intel runner and `macos-latest` the Apple
      # Silicon one: a bundle is the interpreter and every compiled extension
      # for the machine that built it, and there is no cross compilation for
      # this. `make_dmg.sh` names the disk image from `uname -m`, so the two
      # do not collide. The older of the two Intel images on purpose: a
      # bundle runs on the macOS it was built on and newer, and the Intel
      # Macs still in use are the older ones. A label GitHub no longer has
      # (`macos-13`, retired) is not refused — it is queued forever, which
      # is how the first v1.0.2 build spent forty minutes.
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest, macos-15-intel]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0"

      - name: Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libdbus-1-3 libglib2.0-0 xvfb

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pyinstaller

      - name: Build
        run: python -m PyInstaller packaging/milq.spec --noconfirm

      # a layered icon for macOS 26, compiled by Xcode 26's actool; the
      # .icns stays for older systems, and a runner without Xcode 26 says so
      - name: Liquid Glass icon
        if: runner.os == 'macOS'
        run: bash packaging/make_liquid_icon.sh "$PWD/dist/MIL-Q.app"

      # the bundle either reads a .wiff or it does not, and this is the only
      # way to find out without a person and a mouse
      - name: The bundle works
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            QT_QPA_PLATFORM=offscreen dist/MIL-Q.app/Contents/MacOS/MIL-Q --selftest
          elif [ "$RUNNER_OS" = "Windows" ]; then
            QT_QPA_PLATFORM=offscreen ./dist/MIL-Q/MIL-Q.exe --selftest
          else
            xvfb-run -a ./dist/MIL-Q/MIL-Q --selftest
          fi

      - name: Disk image
        if: runner.os == 'macOS'
        run: bash packaging/make_dmg.sh "$PWD/dist"

      - name: Installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          $version = (Select-String -Path milq/__init__.py `
            -Pattern '__version__ = "([^"]+)"').Matches.Groups[1].Value
          wix build packaging/milq.wxs -d Version=$version `
            -d BundleDir="$PWD\dist\MIL-Q" `
            -d IconFile="$PWD\packaging\icons\MIL-Q.ico" `
            -o "dist/MIL-Q-$version-windows-x64.msi"

      # The same folder the MSI wraps, zipped: unpack it anywhere and run
      # MIL-Q.exe. A machine whose administrator will not let an installer
      # run — a shared library computer, say — can still be given the
      # application this way, and nothing is written outside the folder
      # except the preferences and ~/.milq.
      - name: Portable archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (Select-String -Path milq/__init__.py `
            -Pattern '__version__ = "([^"]+)"').Matches.Groups[1].Value
          Compress-Archive -Path dist/MIL-Q -DestinationPath `
            "dist/MIL-Q-$version-windows-x64.zip" -CompressionLevel Optimal

      - name: Tarball
        if: runner.os == 'Linux'
        run: |
          version=$(python -c "import milq; print(milq.__version__)")
          # the launcher entry and its icon travel in the folder; install.sh
          # registers them for the user without touching /usr
          cp packaging/linux/milq.desktop packaging/linux/install.sh dist/MIL-Q/
          cp packaging/icons/MIL-Q.iconset/icon_256x256.png dist/MIL-Q/milq.png
          chmod +x dist/MIL-Q/install.sh
          tar -C dist -czf "dist/MIL-Q-$version-linux-x86_64.tar.gz" MIL-Q

      # WiX built a 36 KB installer once and called it a success, because a
      # glob that matches nothing is not an error. Every installer here holds
      # a Python interpreter, Qt and numpy; anything under 20 MB is empty.
      - name: The installer is not empty
        shell: bash
        run: |
          shopt -s nullglob
          built=(dist/*.dmg dist/*.msi dist/*.zip dist/*.tar.gz)
          [ ${#built[@]} -gt 0 ] || { echo "nothing was built" >&2; exit 1; }
          status=0
          for file in "${built[@]}"; do
            size=$(wc -c < "$file")
            printf '%s %s bytes\n' "$file" "$size"
            [ "$size" -ge 20000000 ] || { echo "  too small to hold an app" >&2; status=1; }
          done
          exit $status

      - uses: actions/upload-artifact@v4
        with:
          # the runner, not the system: two macOS runners build two
          # different bundles and `runner.os` is "macOS" for both
          name: milq-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.msi
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error

      # a build artefact expires; a release does not, and it is the only copy
      # anyone else can be pointed at
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          # each runner has only its own installer, and whichever of the three
          # arrives first is the one that creates the release
          shopt -s nullglob
          built=(dist/*.dmg dist/*.msi dist/*.zip dist/*.tar.gz)
          [ ${#built[@]} -gt 0 ] || { echo "nothing was built" >&2; exit 1; }
          gh release create "${GITHUB_REF_NAME}" --generate-notes --verify-tag \
            --title "MIL-Q ${GITHUB_REF_NAME}" 2>/dev/null || true
          gh release upload "${GITHUB_REF_NAME}" "${built[@]}" --clobber


  checksums:
    # One list of sums over everything the release serves, published beside
    # the installers. It is its own job because each packaging runner uploads
    # only its own file and none of them knows when the others are done —
    # `needs: package` is what "when the others are done" means here.
    #
    # The sums are taken over the assets **downloaded back from the release**
    # rather than over what the build produced. They are the same bytes, and
    # only one of them is what a person actually gets; a checksum of the
    # other one would be a claim about a file nobody downloads.
    name: Checksums
    runs-on: ubuntu-latest
    needs: package
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Sum what the release serves
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p assets
          cd assets
          gh release download "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" \
            --pattern '*.dmg' --pattern '*.msi' --pattern '*.zip' \
            --pattern '*.tar.gz'
          # named rather than globbed, so the file being written is not summed
          sha256sum MIL-Q-* > SHA256SUMS
          cat SHA256SUMS
          gh release upload "${GITHUB_REF_NAME}" SHA256SUMS --clobber \
            --repo "${GITHUB_REPOSITORY}"
