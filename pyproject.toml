[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "milq"
# read from milq/__init__.py: a version written twice is a version that
# will disagree with itself at the first bump
dynamic = ["version"]
description = "Open source quantitation and review for SCIEX LC-MS data (.wiff)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "PyQt6>=6.5",
    "pyqtgraph>=0.13",
    "alpharaw>=0.7",
    "pythonnet>=3.0",
    "certifi",
]

[project.scripts]
milq = "milq.app:main"

[tool.setuptools.dynamic]
version = { attr = "milq.__version__" }

[tool.setuptools.packages.find]
include = ["milq*"]

[tool.setuptools.package-data]
# the second pattern is the manual's translations: a glob of one directory
# does not reach into another, so a new language needs a line of its own
milq = ["help/pages/*.md", "help/pages/*/*.md", "icon.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `tests/real` is asserted against acquisitions that are not in the repository
# and never will be. Those tests are skipped unless the data is asked for —
# by `-m real` or by `MILQ_REAL_DATA=1` — so CI, which has no data,
# runs the rest of the suite unchanged. See tests/real/README.md.
markers = [
    "real: a regression over real data outside the repository (see tests/real/README.md)",
]
